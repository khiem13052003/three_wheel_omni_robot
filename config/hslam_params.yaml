# hector_mapping parameters
map_frame: "map"
base_frame: "base_link"
odom_frame: "odom"

use_tf_scan_transformation: false
use_tf_pose_start_estimate: true
pub_map_odom_transform: true

map_resolution: 0.050
map_size: 512
map_start_x: 0.5
map_start_y: 0.5
map_multi_res_levels: 2

update_factor_free: 0.2
update_factor_occupied: 0.85
map_update_distance_thresh: 0.4
map_update_angle_thresh: 0.6
map_pub_period: 1.0

advertise_map_service: true

scan_subscriber_queue_size: 5.0
scan_topic: "scan"

tf_map_scanmatch_transform_frame_name: "scanmatcher_frame"
pub_map_scanmatch_transform: true

