fixed_frame: odom
base_frame: base_link

use_odom: false
use_imu: false
use_vel: false

use_cloud_input: false

kf_dist_linear: 0.05
kf_dist_angular: 0.087

publish_tf: false
publish_pose: false
publish_pose_stamped: true

max_iterations: 10
max_correspondence_dist: 0.3
max_linear_correction: 0.3
max_angular_correction_deg: 30.0
epsilon_xy: 1e-4
epsilon_theta: 1e-4
outliers_maxPerc: 0.90

sigma: 0.01
use_corr_tricks: true
restart: false
restart_threshold_mean_error: 0.01
restart_dt: 1.0
restart_dtheta: 0.1
clustering_threshold: 0.25
orientation_neighbourhood: 10
use_point_to_line_distance: true
do_alpha_test: false
do_alpha_test_thresholdDeg: 20.0
outliers_adaptive_order: 0.7
outliers_adaptive_mul: 2.0
do_visibility_test: false
outliers_remove_doubles: true
do_compute_covariance: false

